[[check]]
at = 1482
label = "Central Sector gate bridge"
display_enabled = true
screen_hash = "fc0ff80fe007c011a7873f9f7f3ffe1fc79fc67f64e7e1c7fffffffefffbe7c7"
screenshot = true

# CROSS on the exit arrow leads to the Asuka Bridge (0x1C4), where a second arrow at the far end leads on.
[[wait]]
at = 1486
label = "Asuka Bridge"
ram = [{ addr = 0x800554D4, size = 4, value = 0x1C4 }, { addr = 0x800554D0, size = 4, value = 2 }]
timeout = 1500
press = "CROSS"
every = 10
press_hold = 3

[[walk]]
at = 1488
label = "to the Central Park arrow"
x = { via = 0x8004ADC0, addr = 0x58, size = 4 }
z = { via = 0x8004ADC0, addr = 0x5C, size = 4 }
target = [226, 494]
tolerance = 5
timeout = 900
guard = [{ addr = 0x800554D4, size = 4, value = 0x1C4 }]

[[check]]
at = 1490
label = "Asuka Bridge"
display_enabled = true
screen_hash = "e600f00089000780ef1fed87f103e8004fff7ffb6ffbedbc48ab49eb49fb4fff"
screenshot = true

[[wait]]
at = 1494
label = "Central Park"
ram = [{ addr = 0x800554D4, size = 4, value = 0x1D2 }, { addr = 0x800554D0, size = 4, value = 2 }]
timeout = 1500
press = "CROSS"
every = 10
press_hold = 3

[[check]]
at = 1744
label = "Central Park"
display_enabled = true
screen_hash = "ff80e30081800000ffc0ffc0ff00f8809ffcbffcfff8fbf013ff93ff93ff93fe"
screenshot = true

# The walk to the encounter is field_battle.toml's. From the battle on there is no scripted input: auto-battle
# picks Fight, the target and the attack each turn and passes the results screens back to the field.
[[wait]]
at = 1804
label = "random encounter"
ram = [{ addr = 0x800554D0, size = 4, value = 6 }]
timeout = 4000
hold = ["LEFT"]

[[wait]]
at = 1810
label = "battle won"
ram = [{ addr = 0x800554D0, size = 4, value = 20 }]
timeout = 4000

[[check]]
at = 1910
label = "victory"
display_enabled = true
ram = [{ addr = 0x800A3260, size = 2, value = 0 }]
screenshot = true

[[wait]]
at = 1911
label = "back in the field"
ram = [{ addr = 0x800554D0, size = 4, value = 2 }, { addr = 0x800554D4, size = 4, value = 0x1D2 }]
timeout = 1500

[[check]]
at = 2161
label = "field after the battle"
display_enabled = true
ram = [{ addr = 0x800554D0, size = 4, value = 2 }, { addr = 0x800554D4, size = 4, value = 0x1D2 }]
screenshot = true
