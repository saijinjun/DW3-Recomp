// The Android app: SDL's Java activity around libmain.so (the program, built from the top-level CMakeLists.txt), the zig
// compiler as libzig.so (installed as a native library so that it may be run), the rest of the toolchain the setup
// builds the game module with, as the asset toolchain.zip, and the upscaler model for the HD backgrounds (Real-ESRGAN,
// BSD 3-Clause; downloaded at build time and checked against its SHA-256). Build with
//   gradle assembleRelease   (Gradle 8.12 or later) -PzigDir=<unpacked zig-aarch64-linux distribution>
// The APK holds no game data: the player picks their own disc image on first start, and the game and the HD
// backgrounds are made from it on the phone.
//
// Signing: -PkeystoreFile=<file> -PkeystorePassword=<password> [-PkeyAlias=<alias>] (or the environment variables
// DW3_KEYSTORE, DW3_KEYSTORE_PASSWORD, DW3_KEY_ALIAS). Keep one key for every release, so that a newer build installs
// over an older one and keeps its saves; the key is never part of this repository. Without one, the release build is
// signed with the local debug key, which only suits testing.

import java.security.MessageDigest

plugins {
    id 'com.android.application'
}

def repoRoot = file('../..')
def zigDir = project.findProperty('zigDir')
def generatedDir = layout.buildDirectory.dir('generated/toolchain')
def signingFile = project.findProperty('keystoreFile') ?: System.getenv('DW3_KEYSTORE')
def signingPassword = project.findProperty('keystorePassword') ?: System.getenv('DW3_KEYSTORE_PASSWORD')
def signingAlias = project.findProperty('keyAlias') ?: System.getenv('DW3_KEY_ALIAS') ?: 'dw3recomp'

// The model the HD background step runs (app/wizard/assets.cpp names the same files and hashes).
def modelBase = 'https://github.com/MikeRavenelle/DigimonWorld3-Recomp/releases/download/models-v1/'
def modelFiles = [
    'RealESRGAN_General_x4_v3.param': '8a0c4b4fd1c57c945ef24477edbdbeba8a509ca9c9adf8f63f51c265ea1bcc89',
    'RealESRGAN_General_x4_v3.bin'  : '8fdd6052f8931091164a570ee7b5c5b2d1dcd991112d464eb9ae1a5b52ece553',
]
def modelCache = layout.buildDirectory.dir('model-download')

android {
    namespace = 'com.dw3recomp'
    compileSdk = 35
    if (project.hasProperty('ndkVersion')) ndkVersion = project.property('ndkVersion')

    defaultConfig {
        applicationId = 'com.dw3recomp'
        minSdk = 28  // posix_spawn, which SDL starts the compiler with
        targetSdk = 35
        versionCode = (project.findProperty('versionCode') ?: '1') as int
        versionName = '0.1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DDW3_BUILD_TESTS=OFF', '-DANDROID_PLATFORM=android-28', '-DANDROID_STL=c++_static',
                          '-DCMAKE_BUILD_TYPE=Release', '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
                targets 'dw3recomp', 'SDL3-shared'
            }
        }
    }

    signingConfigs {
        if (signingFile) {
            release {
                storeFile file(signingFile)
                storePassword signingPassword
                keyAlias signingAlias
                keyPassword signingPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingFile ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            if (signingFile) signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            if (project.hasProperty('cmakeVersion')) version = project.property('cmakeVersion')
        }
    }

    sourceSets.main {
        assets.srcDir generatedDir.map { it.dir('assets') }
        jniLibs.srcDir generatedDir.map { it.dir('jniLibs') }
    }

    packaging {
        jniLibs {
            // Native libraries are unpacked on install, which is what lets the compiler be run from there.
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libzig.so']
        }
    }
    androidResources {
        noCompress += ['zip']
    }
    lint {
        abortOnError = false
    }
}

// The toolchain: the compiler, zig's compiler headers (the module is freestanding: no libc is linked), the header the
// recompiled code includes and the module's entry point and string functions. The stamp tells the app to unpack a new copy.
// Also the upscaler model, as the assets models/<name>.
def sha256Of = { File f ->
    def digest = MessageDigest.getInstance('SHA-256')
    f.withInputStream { s ->
        byte[] buffer = new byte[1 << 16]
        int n
        while ((n = s.read(buffer)) > 0) digest.update(buffer, 0, n)
    }
    digest.digest().encodeHex().toString()
}

tasks.register('dw3Models') {
    inputs.property('models', modelFiles)
    outputs.dir(modelCache)
    doLast {
        def dir = modelCache.get().asFile
        dir.mkdirs()
        modelFiles.each { name, sha ->
            def file = new File(dir, name)
            if (file.exists() && sha256Of(file) == sha) return
            new URL(modelBase + name).withInputStream { i -> file.withOutputStream { o -> o << i } }
            def got = sha256Of(file)
            if (got != sha) {
                file.delete()
                throw new GradleException("${name}: SHA-256 ${got}, expected ${sha}")
            }
        }
    }
}

tasks.register('dw3Toolchain') {
    dependsOn 'dw3Models'
    inputs.property('zigDir', zigDir ?: '')
    inputs.dir(modelCache)
    inputs.files(fileTree(repoRoot) { include 'runtime/include/dw3/recomp.h', 'runtime/module/*.c' })
    outputs.dir(generatedDir)
    doLast {
        if (!zigDir) throw new GradleException('Pass -PzigDir=<unpacked zig aarch64-linux distribution>.')
        def zig = file(zigDir)
        def out = generatedDir.get().asFile
        project.delete(out)
        def libs = new File(out, 'jniLibs/arm64-v8a')
        def assets = new File(out, 'assets')
        libs.mkdirs()
        assets.mkdirs()
        project.copy {
            from new File(zig, 'zig')
            into libs
            rename { 'libzig.so' }
        }
        def zip = new File(assets, 'toolchain.zip')
        ant.zip(destfile: zip) {
            zipfileset(dir: new File(zig, 'lib/include'), prefix: 'lib/include')
            zipfileset(file: new File(zig, 'LICENSE'), fullpath: 'LICENSE.zig')
            zipfileset(file: new File(repoRoot, 'runtime/include/dw3/recomp.h'), fullpath: 'include/dw3/recomp.h')
            zipfileset(dir: new File(repoRoot, 'runtime/module'), includes: '*.c', prefix: 'module')
        }
        new File(assets, 'toolchain.stamp').text = sha256Of(zip)
        project.copy {
            from modelCache
            into new File(assets, 'models')
        }
    }
}
preBuild.dependsOn 'dw3Toolchain'
