name: Android personal build

on:
  push:
    branches: [main, android-port]
  workflow_dispatch:

concurrency:
  group: android-personal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

# The owner's own APK: the Android app with the owner's disc and the game module prepared from it built in, so that it
# installs and starts straight into the game. The disc and module live on the personal-data branch of this private
# repository (never merged anywhere) and the APK goes to the private "personal" release. Never publish either.

jobs:
  apk:
    name: Personal APK (arm64)
    runs-on: ubuntu-24.04
    env:
      ZIG_VERSION: 0.17.0
      ZIG_ARCHIVE: zig-aarch64-linux-0.17.0.tar.xz
      ZIG_SHA256: 9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8
    steps:
      - uses: actions/checkout@v4

      - name: Personal data
        id: data
        run: |
          if ! git ls-remote --exit-code origin personal-data > /dev/null; then
            echo "No personal-data branch: nothing to build."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth 1 origin personal-data
          mkdir "$RUNNER_TEMP/bundle"
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/bundle"
          cd "$RUNNER_TEMP/bundle"
          cat disc.bin.zst.part* > disc.bin.zst && rm disc.bin.zst.part*
          sha256sum -c SHA256SUMS
          echo "present=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.data.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        if: steps.data.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools spirv-tools

      - name: Fetch zig
        if: steps.data.outputs.present == 'true'
        run: |
          curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/$ZIG_ARCHIVE" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/zig" && tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1

      # The newest CMake the SDK offers (the project needs 3.24 or later) and the newest NDK on the runner.
      - name: Android SDK packages
        if: steps.data.outputs.present == 'true'
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          cmake_pkg=$("$sdkmanager" --list 2>/dev/null | grep -o 'cmake;[0-9.]*' | sort -t';' -k2 -V | tail -1)
          yes | "$sdkmanager" --install "$cmake_pkg" > /dev/null
          echo "CMAKE_VERSION=${cmake_pkg#cmake;}" >> "$GITHUB_ENV"
          echo "NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")" >> "$GITHUB_ENV"
          echo "Using CMake ${cmake_pkg#cmake;}, NDK $(basename "$ANDROID_NDK_LATEST_HOME")"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.data.outputs.present == 'true'
        with:
          gradle-version: 8.12

      - name: Build
        if: steps.data.outputs.present == 'true'
        working-directory: android
        run: |
          gradle --no-daemon assembleRelease -PzigDir="$RUNNER_TEMP/zig" -PcmakeVersion="$CMAKE_VERSION" \
            -PndkVersion="$NDK_VERSION" -PversionCode="$((1000 + ${{ github.run_number }}))" -PbundleDir="$RUNNER_TEMP/bundle"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/DW3-personal.apk"
          ls -la "$RUNNER_TEMP/DW3-personal.apk"

      # A release asset, not a workflow artifact: artifacts count against the account's small private storage quota.
      - name: Publish to the private release
        if: steps.data.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Personal build from ${GITHUB_SHA::7} (${GITHUB_REF_NAME}). Contains the owner's own disc: do not share."
          if gh release view personal > /dev/null 2>&1; then
            gh release edit personal --notes "$notes"
          else
            gh release create personal --title "Personal APK" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload personal "$RUNNER_TEMP/DW3-personal.apk" --clobber
